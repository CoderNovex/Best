<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Racer</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79add2;font-family:Arial}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:15px;left:15px;color:#fff;background:#000c;padding:12px 15px;border-radius:12px;z-index:10}#speed{font-size:24px;font-weight:bold}</style></head><body><div id="hud"><div id="speed">0 km/h</div>WASD / arrows • Space = handbrake • R = reset</div><canvas id="game"></canvas><script>(function(){var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=0,H=0;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();var keys={};window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});var car={x:0,z:0,a:0,v:0,d:0};function reset(){car.x=0;car.z=0;car.a=0;car.v=0;car.d=0}var buildings=[],trees=[];for(var i=0;i<70;i++){var a=Math.random()*6.283,r=100+Math.random()*700;buildings.push({x:Math.cos(a)*r,z:Math.sin(a)*r,w:15+Math.random()*25,h:20+Math.random()*60,c:i%2?'#68717a':'#7d858c'})}for(var j=0;j<90;j++){var b=Math.random()*6.283,q=100+Math.random()*800;trees.push({x:Math.cos(b)*q,z:Math.sin(b)*q})}function project(x,y,z){var dx=x-car.x,dz=z-car.z,c=Math.cos(car.a),s=Math.sin(car.a),rx=dx*c-dz*s,rz=dx*s+dz*c;if(rz<5)return null;var f=Math.min(W,H)*.9;return{x:W/2+rx*f/rz,y:H*.47-y*f/rz,s:f/rz,z:rz}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#78acd2';ctx.fillRect(0,0,W,H*.48);ctx.fillStyle='#507b43';ctx.fillRect(0,H*.48,W,H*.52);ctx.fillStyle='#363a3e';ctx.beginPath();ctx.moveTo(W*.46,H*.48);ctx.lineTo(W*.54,H*.48);ctx.lineTo(W*.94,H);ctx.lineTo(W*.06,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8cf4d';ctx.lineWidth=4;ctx.setLineDash([25,25]);ctx.beginPath();ctx.moveTo(W/2,H*.48);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);var list=[];for(var i=0;i<buildings.length;i++){var p=project(buildings[i].x,buildings[i].h/2,buildings[i].z);if(p&&p.z<1000)list.push({p:p,b:buildings[i],t:0})}for(var k=0;k<trees.length;k++){var t=project(trees[k].x,22,trees[k].z);if(t&&t.z<1000)list.push({p:t,b:trees[k],t:1})}list.sort(function(a,b){return b.p.z-a.p.z});for(var n=0;n<list.length;n++){var o=list[n],p=o.p;if(o.t===0){var bw=o.b.w*p.s/40,bh=o.b.h*p.s/40;ctx.fillStyle=o.b.c;ctx.fillRect(p.x-bw/2,p.y-bh,bw,bh);ctx.fillStyle='#252a2e';for(var yy=p.y-bh+8;yy<p.y-5;yy+=12){for(var xx=p.x-bw/2+6;xx<p.x+bw/2-4;xx+=12)ctx.fillRect(xx,yy,5,6)}}else{var ss=p.s*.7;ctx.fillStyle='#6b472c';ctx.fillRect(p.x-ss*.07,p.y-ss*.7,ss*.14,ss*.7);ctx.fillStyle='#28613a';ctx.beginPath();ctx.arc(p.x,p.y-ss*.78,ss*.42,0,6.283);ctx.fill()}}var sc=Math.min(W,H)/700;ctx.save();ctx.translate(W/2,H*.79);ctx.rotate(-car.a*.35);ctx.fillStyle='#151515';ctx.fillRect(-82*sc,8*sc,164*sc,55*sc);ctx.fillStyle='#d53232';ctx.fillRect(-70*sc,-5*sc,140*sc,58*sc);ctx.fillStyle='#253b55';ctx.fillRect(-48*sc,-32*sc,96*sc,35*sc);ctx.fillStyle='#111';ctx.fillRect(-58*sc,38*sc,32*sc,13*sc);ctx.fillRect(26*sc,38*sc,32*sc,13*sc);ctx.restore()}var last=Date.now();function loop(){var now=Date.now(),dt=Math.min(.05,(now-last)/1000);last=now;var up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;if(up)car.v+=35*dt;if(down)car.v-=42*dt;if(!up&&!down)car.v*=Math.pow(.985,dt*60);if(keys[' '])car.v*=Math.pow(.94,dt*60);if(car.v>80)car.v=80;if(car.v<-15)car.v=-15;var steer=(left?-1:0)+(right?1:0);car.a+=steer*(car.v/35)*(keys[' ']?.9:1.8)*dt;car.x+=Math.sin(car.a)*car.v*dt;car.z+=Math.cos(car.a)*car.v*dt;car.d+=Math.abs(car.v*dt);document.getElementById('speed').textContent=Math.round(Math.abs(car.v)*3.6)+' km/h';draw();window.requestAnimationFrame(loop)}reset();loop()})();</script></body></html>
