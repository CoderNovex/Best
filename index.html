<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Racer 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9df;font-family:Arial}canvas{display:block}#hud{position:fixed;top:15px;left:15px;color:#fff;background:#000b;padding:12px 15px;border-radius:12px;z-index:5;line-height:1.45}#speed{font-size:24px;font-weight:700}#error{position:fixed;inset:0;display:none;place-items:center;color:#fff;background:#111;font-size:20px;text-align:center;padding:30px}</style></head><body><div id="hud"><div id="speed">0 km/h</div>WASD / Arrow keys • Space = handbrake • R = reset</div><div id="error">3D engine failed to load.<br>Refresh the page or check the internet connection.</div><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js" onerror="document.getElementById('error').style.display='grid'"></script><script>window.addEventListener('load',function(){if(typeof THREE==='undefined')return;const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9df);scene.fog=new THREE.Fog(0x87b9df,250,1200);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1600);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf5ff,0x486b3d,1.8));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(200,300,100);scene.add(sun);const mat=c=>new THREE.MeshLambertMaterial({color:c});const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),mat(0x527c45));ground.rotation.x=-Math.PI/2;scene.add(ground);function addRoad(x,z,w,d,rot){const m=box(w,.12,d,0x363a3e);m.position.set(x,.06,z);m.rotation.y=rot;scene.add(m)}addRoad(0,0,32,900,0);addRoad(0,0,32,900,Math.PI/2);addRoad(0,0,28,650,.7);addRoad(0,0,28,650,-.7);for(let z=-430;z<=430;z+=28){const m=box(.25,.04,12,0xe8cf4d);m.position.set(0,.14,z);scene.add(m)}for(let i=0;i<130;i++){const a=Math.random()*Math.PI*2,d=80+Math.random()*520,x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.abs(x)<28||Math.abs(z)<28)continue;if(Math.random()<.62){const w=6+Math.random()*12,h=4+Math.random()*15;const b=box(w,h,w,Math.random()<.5?0x69727a:0x7e858a);b.position.set(x,h/2,z);b.rotation.y=Math.random()*Math.PI;scene.add(b)}else{const trunk=box(1.2,4,1.2,0x68462c);trunk.position.set(x,2,z);scene.add(trunk);const crown=box(5,5,5,0x2f633a);crown.position.set(x,5.5,z);crown.rotation.y=Math.random()*Math.PI;scene.add(crown)}}for(const p of [[90,90],[-170,140],[190,-160],[-270,-220]]){const ramp=box(18,5,32,0x999999);ramp.position.set(p[0],2.5,p[1]);ramp.rotation.x=-.18;ramp.rotation.z=-.32;scene.add(ramp)}const car=new THREE.Group();const body=box(3.5,1.1,6.2,0xd63232);body.position.y=1.05;car.add(body);const cabin=box(2.55,1.05,2.7,0x243c57);cabin.position.set(0,1.85,-.35);car.add(cabin);const wheelGeo=new THREE.CylinderGeometry(.5,.5,.38,12),wheelMat=mat(0x151515);for(const x of[-1.55,1.55])for(const z of[-2,2]){const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.z=Math.PI/2;w.position.set(x,.62,z);car.add(w)}scene.add(car);let velocity=0,keys={};function reset(){car.position.set(0,.2,18);car.rotation.y=0;velocity=0}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function animate(t){requestAnimationFrame(animate);const dt=Math.min(.05,(t-(animate.last||t))/1000);animate.last=t;const up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;if(up)velocity+=32*dt;if(down)velocity-=40*dt;if(!up&&!down)velocity*=Math.pow(.985,dt*60);if(keys[' '])velocity*=Math.pow(.94,dt*60);velocity=THREE.MathUtils.clamp(velocity,-18,78);const steer=(left?-1:0)+(right?1:0);car.rotation.y+=steer*(velocity/34)*(keys[' ']?.9:1.8)*dt;car.position.x+=Math.sin(car.rotation.y)*velocity*dt;car.position.z+=Math.cos(car.rotation.y)*velocity*dt;const desired=new THREE.Vector3(0,6.2,-12).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y).add(car.position);camera.position.lerp(desired,1-Math.pow(.0002,dt));camera.lookAt(car.position.x,car.position.y+1,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(velocity)*3.6)+' km/h';renderer.render(scene,camera)}reset();animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})});</script></body></html>
