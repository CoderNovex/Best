<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Racer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#87b7dc;font-family:Arial}#hud{position:fixed;top:15px;left:15px;color:#fff;background:#000b;padding:12px 15px;border-radius:12px;z-index:10}#speed{font-size:24px;font-weight:bold}</style></head><body><div id="hud"><div id="speed">0 km/h</div>WASD / Arrow keys • Space = handbrake • R = reset</div><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>window.addEventListener('load',()=>{const s=new THREE.Scene();s.background=new THREE.Color(0x87b7dc);s.fog=new THREE.Fog(0x87b7dc,200,1000);const c=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);const r=new THREE.WebGLRenderer({antialias:false});r.setPixelRatio(Math.min(devicePixelRatio,1.2));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0xffffff,0x406030,1.8));const g=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x527943}));g.rotation.x=-Math.PI/2;s.add(g);function B(x,y,z,w,h,d,col,rot=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);m.rotation.y=rot;s.add(m)}function road(x,z,w,l,rot=0){B(x,.05,z,w,.1,l,0x36393d,rot)}road(0,0,30,800);road(0,0,30,800,Math.PI/2);road(0,0,28,560,.7);road(0,0,28,560,-.7);for(let i=0;i<90;i++){let a=Math.random()*6.28,q=70+Math.random()*450,x=Math.cos(a)*q,z=Math.sin(a)*q;if(Math.abs(x)<25||Math.abs(z)<25)continue;let h=4+Math.random()*10;B(x,h/2,z,5+Math.random()*8,h,5+Math.random()*8,Math.random()<.6?0x70757a:0x315f37,Math.random()*6.28)}for(const p of [[90,90],[-170,140],[190,-160],[-260,-220]])B(p[0],2.5,p[1],18,5,30,0x9b9b9b,-.35);const car=new THREE.Group();function CB(w,h,d,col,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(0,y,z);car.add(m)}CB(3.4,1,6,0xd52f2f,1,0);CB(2.5,1,2.6,0x243b55,1.7,-.4);const wg=new THREE.CylinderGeometry(.5,.5,.35,12),wm=new THREE.MeshLambertMaterial({color:0x151515});for(const x of[-1.55,1.55])for(const z of[-2,2]){const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.6,z);car.add(w)}car.position.set(0,.2,18);s.add(car);let v=0,keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r'){car.position.set(0,.2,18);v=0;car.rotation.y=0}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let last=performance.now();function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;const f=keys.w||keys.arrowup,b=keys.s||keys.arrowdown,l=keys.a||keys.arrowleft,rr=keys.d||keys.arrowright;if(f)v+=30*dt;if(b)v-=38*dt;if(!f&&!b)v*=Math.pow(.985,dt*60);if(keys[' '])v*=Math.pow(.95,dt*60);v=THREE.MathUtils.clamp(v,-20,75);car.rotation.y+=((l?-1:0)+(rr?1:0))*(v/35)*dt;car.position.x+=Math.sin(car.rotation.y)*v*dt;car.position.z+=Math.cos(car.rotation.y)*v*dt;const target=car.position.clone().add(new THREE.Vector3(0,6,-12).applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y));c.position.lerp(target,.12);c.lookAt(car.position.x,car.position.y+1,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(v)*3.6)+' km/h';r.render(s,c)}animate(last);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})});</script></body></html>
