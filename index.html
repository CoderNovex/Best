<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Racer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#7fb5dc;font-family:Arial}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:15px;left:15px;color:#fff;background:#000b;padding:12px 15px;border-radius:12px;z-index:5}#speed{font-size:24px;font-weight:bold}</style></head><body><div id="hud"><div id="speed">0 km/h</div>WASD / Arrow keys • Space = handbrake • R = reset</div><canvas id="game"></canvas><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let car={x:0,z:0,angle:0,speed:0,dist:0};function reset(){car={x:0,z:0,angle:0,speed:0,dist:0}}
// Lightweight pseudo-3D renderer: no libraries, no downloads, potato-PC friendly.
const buildings=[];for(let i=0;i<85;i++){let a=Math.random()*Math.PI*2,r=120+Math.random()*850;buildings.push({x:Math.cos(a)*r,z:Math.sin(a)*r,w:12+Math.random()*25,h:15+Math.random()*55,d:12+Math.random()*25,c:Math.random()<.5?'#59616a':'#737b82'})}
const trees=[];for(let i=0;i<100;i++){let a=Math.random()*Math.PI*2,r=100+Math.random()*900;trees.push({x:Math.cos(a)*r,z:Math.sin(a)*r})}
function project(x,y,z){let dx=x-car.x,dz=z-car.z,ca=Math.cos(-car.angle),sa=Math.sin(-car.angle),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<2)return null;const f=Math.min(W,H)*.95;return {x:W/2+rx*f/rz,y:H*.48-y*f/rz,s:f/rz,z:rz}}
function poly(points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function render(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H*.6);sky.addColorStop(0,'#76acd4');sky.addColorStop(1,'#d5e5ee');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#4f7c45';ctx.fillRect(0,H*.48,W,H*.52);
 // road perspective
 const horizon=H*.48, roadNear=W*.92, roadFar=W*.08;poly([{x:W/2-roadFar/2,y:horizon},{x:W/2+roadFar/2,y:horizon},{x:W/2+roadNear/2,y:H},{x:W/2-roadNear/2,y:H}],'#34383c');
 // road markings
 ctx.strokeStyle='#e7c84a';ctx.lineWidth=4;ctx.setLineDash([22,20]);ctx.beginPath();ctx.moveTo(W/2,horizon);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
 const objs=[];for(const b of buildings){let p=project(b.x,b.h*.5,b.z);if(p&&p.z<1100)objs.push({p,b,type:0})}for(const t of trees){let p=project(t.x,25,t.z);if(p&&p.z<1000)objs.push({p,t,type:1})}objs.sort((a,b)=>b.p.z-a.p.z);
 for(const o of objs){let p=o.p;if(o.type===0){let b=o.b,w=b.w*p.s/40,h=b.h*p.s/40,d=b.d*p.s/40;ctx.fillStyle=b.c;ctx.fillRect(p.x-w/2,p.y-h,w,h);ctx.fillStyle='#24282d';for(let yy=p.y-h+8;yy<p.y-5;yy+=12)for(let xx=p.x-w/2+6;xx<p.x+w/2-4;xx+=12)ctx.fillRect(xx,yy,5,6)}else{let s=p.s*.75;ctx.fillStyle='#6a472d';ctx.fillRect(p.x-s*.08,p.y-s*.7,s*.16,s*.7);ctx.fillStyle='#28603a';ctx.beginPath();ctx.arc(p.x,p.y-s*.8,s*.42,0,Math.PI*2);ctx.fill()}}
 // car
 const cx=W/2,cy=H*.78,scale=Math.min(W,H)/700;ctx.save();ctx.translate(cx,cy);ctx.rotate(-car.angle*.35);ctx.fillStyle='#111';ctx.fillRect(-82*scale,10*scale,164*scale,55*scale);ctx.fillStyle='#d53232';ctx.fillRect(-70*scale,-5*scale,140*scale,60*scale);ctx.fillStyle='#263c55';ctx.fillRect(-48*scale,-32*scale,96*scale,35*scale);ctx.fillStyle='#181818';ctx.fillRect(-58*scale,38*scale,32*scale,13*scale);ctx.fillRect(26*scale,38*scale,32*scale,13*scale);ctx.restore();
}
let last=performance.now();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;let up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;if(up)car.speed+=35*dt;if(down)car.speed-=42*dt;if(!up&&!down)car.speed*=Math.pow(.985,dt*60);if(keys[' '])car.speed*=Math.pow(.94,dt*60);car.speed=Math.max(-15,Math.min(80,car.speed));let steer=(left?-1:0)+(right?1:0);car.angle+=steer*(car.speed/35)*(keys[' ']?.9:1.8)*dt;car.x+=Math.sin(car.angle)*car.speed*dt;car.z+=Math.cos(car.angle)*car.speed*dt;car.dist+=Math.abs(car.speed*dt);document.getElementById('speed').textContent=Math.round(Math.abs(car.speed)*3.6)+' km/h';render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
